# Backend CI: runs the same checks as local development on every push/PR that touches the backend.
# MySQL runs as a GitHub Actions service on GitHub's machines (no Docker files in this repository).
name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

# If you push again before a run finishes, cancel the older run.
concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, Django checks and tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_DATABASE: uniflow
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    # Same variables as backend/.env locally (CI has no .env file).
    env:
      DJANGO_SECRET_KEY: ci-only-not-a-secret-but-at-least-32-bytes-long
      DB_NAME: uniflow
      DB_USER: root
      DB_PASSWORD: ci-root-password
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      PIPENV_VENV_IN_PROJECT: "1"
      PIPENV_NOSPIN: "1"

    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install MySQL client headers (needed to build mysqlclient on Linux)
        run: sudo apt-get update && sudo apt-get install -y pkg-config default-libmysqlclient-dev

      - name: Install Pipenv
        run: python -m pip install --upgrade pip pipenv

      - name: Install dependencies exactly as locked (Pipfile.lock)
        run: pipenv sync --dev

      - name: Ruff lint
        run: pipenv run ruff check .

      - name: Ruff format check
        run: pipenv run ruff format --check .

      - name: Django system check
        run: pipenv run python manage.py check

      - name: No missing migrations
        run: pipenv run python manage.py makemigrations --check --dry-run

      # The production settings must pass Django's own security checklist (M9.5).
      - name: Production settings security check (check --deploy)
        run: pipenv run python manage.py check --deploy --fail-level WARNING
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
          DJANGO_ALLOWED_HOSTS: uniflow.example.com

      - name: Tests (pytest against MySQL)
        run: pipenv run pytest
