# WhatsApp connector CI: its tests, on every push/PR that touches the connector.
name: WhatsApp connector CI

on:
  push:
    branches: [main]
    paths:
      - "connectors/whatsapp/**"
      - ".github/workflows/connector.yml"
  pull_request:
    paths:
      - "connectors/whatsapp/**"
      - ".github/workflows/connector.yml"

concurrency:
  group: connector-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: connectors/whatsapp

    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Set up Node.js (LTS) with npm cache
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: connectors/whatsapp/package-lock.json

      - name: Install dependencies exactly as locked (package-lock.json)
        run: npm ci

      - name: Tests (node --test)
        run: npm test

      - name: Security audit (high and critical only)
        run: npm audit --audit-level=high --omit=dev
