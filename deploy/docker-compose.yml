# Try UniFlow's backend on your own computer exactly as it runs online (Docker Desktop),
# with PostgreSQL like Render.
# Online, Render runs these same images (backend/Dockerfile, connectors/whatsapp/Dockerfile)
# and Vercel builds the website; this file is not used there. From this folder (deploy/):
#   1. Copy-Item .env.example .env      (then fill it in; never commit it)
#   2. docker compose up -d --build     (add --profile whatsapp for the WhatsApp connector)
#   3. http://localhost:8000/api/v1/health/ and http://localhost:8000/django-admin/
# Background jobs: start Inngest's dev server on your computer (not in Docker), pointed at
# http://localhost:8000/api/inngest (command in backend/README.md).
# Full guide: docs/10-testing-and-deployment.md, section 21.
name: uniflow

services:
  # Django (gunicorn). The image applies database changes and collects the admin's styles
  # first, as on Render (backend/Dockerfile).
  backend:
    build: ../backend
    restart: unless-stopped
    ports:
      - "8000:8000" # only for trying it here; online, Render gives it an https:// address
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      # PostgreSQL, like on Render (Render gives DATABASE_URL the same way).
      DATABASE_URL: postgresql://${DB_USER:?Set DB_USER in .env}:${DB_PASSWORD:?Set DB_PASSWORD in .env}@db:5432/${DB_NAME:-uniflow}
      MEDIA_ROOT: /data/media
    # Lets the backend reach Inngest's dev server on your computer (INNGEST_DEV in .env).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - media:/data/media # uploaded timetables (private: never served); unused if S3_BUCKET is set
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  # UniFlow's WhatsApp number. Only started with --profile whatsapp (it needs the number
  # and CONNECTOR_SECRET in .env). The first time, read the pairing code with:
  #   docker compose logs -f connector
  connector:
    build: ../connectors/whatsapp
    profiles: ["whatsapp"]
    restart: unless-stopped
    env_file: .env
    environment:
      UNIFLOW_API_URL: http://backend:8000/api/v1 # inside Docker's private network
      AUTH_DIR: /app/auth
    volumes:
      - whatsapp-auth:/app/auth # the login session: keep it, never share it
    depends_on:
      backend:
        condition: service_healthy

  # The database: PostgreSQL, as online on Render.
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-uniflow}
      POSTGRES_USER: ${DB_USER:?Set DB_USER in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  postgres-data:
  media:
  whatsapp-auth:
