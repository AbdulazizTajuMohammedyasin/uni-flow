# Try UniFlow's backend on your own computer exactly as it runs online (Docker Desktop).
# Online, Render runs these same images (backend/Dockerfile, connectors/whatsapp/Dockerfile)
# and Vercel builds the website; this file is not used there. From this folder (deploy/):
#   1. Copy-Item .env.example .env      (then fill it in; never commit it)
#   2. docker compose up -d --build     (add --profile whatsapp for the WhatsApp connector)
#   3. http://localhost:8000/api/v1/health/ and http://localhost:8000/django-admin/
# Full guide: docs/10-testing-and-deployment.md, section 21.
name: uniflow

services:
  # Django (gunicorn). Applies database changes and collects the admin's styles first.
  backend:
    build: ../backend
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --access-logfile -"
    ports:
      - "8000:8000" # only for trying it here; online, Render gives it an https:// address
    env_file: .env
    environment: &backend-environment
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DB_HOST: db
      DB_PORT: "3306"
      CELERY_BROKER_URL: redis://redis:6379/0
      MEDIA_ROOT: /data/media
    volumes:
      - media:/data/media # uploaded timetables (private: never served)
    depends_on: &backend-needs
      db:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  # Background jobs: AI sorting and understanding, alerts, timetable reading.
  worker:
    build: ../backend
    restart: unless-stopped
    command: celery -A config worker -l info --concurrency 2
    env_file: .env
    environment: *backend-environment
    volumes:
      - media:/data/media
    depends_on: *backend-needs

  # The scheduler: the 03:00 privacy clean-up and the 19:00 daily digest.
  beat:
    build: ../backend
    restart: unless-stopped
    command: celery -A config beat -l info --schedule /data/beat/celerybeat-schedule
    env_file: .env
    environment: *backend-environment
    volumes:
      - beat:/data/beat
    depends_on: *backend-needs

  # UniFlow's WhatsApp number. Only started with --profile whatsapp (it needs the number
  # and CONNECTOR_SECRET in .env). The first time, read the pairing code with:
  #   docker compose logs -f connector
  connector:
    build: ../connectors/whatsapp
    profiles: ["whatsapp"]
    restart: unless-stopped
    env_file: .env
    environment:
      UNIFLOW_API_URL: http://backend:8000/api/v1 # inside Docker's private network
      AUTH_DIR: /app/auth
    volumes:
      - whatsapp-auth:/app/auth # the login session: keep it, never share it
    depends_on:
      backend:
        condition: service_healthy

  # The database. Online it will be PostgreSQL on Render (the next task switches this too).
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-uniflow}
      MYSQL_USER: ${DB_USER:?Set DB_USER in .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped

volumes:
  mysql-data:
  media:
  beat:
  whatsapp-auth:
